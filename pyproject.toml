[project]
name = "agent-storage-guard"
version = "0.3.5"
description = "Local workstation storage and memory alerts, growth history and managed scratch budgets"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agent-storage-guard = "agent_storage_guard.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==8.4.2",
]
