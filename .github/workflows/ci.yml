name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: command -v du
      - run: command -v ps
      - run: command -v lsof
      - run: uv sync --locked
      - run: uv run pytest --collect-only -q
      - run: uv run pytest -q
      - run: uv build
      - name: Verify distribution notices
        run: |
          uv run python - <<'PY'
          import glob, tarfile, zipfile
          for archive in glob.glob("dist/*"):
              if archive.endswith(".whl"):
                  with zipfile.ZipFile(archive) as package:
                      names = package.namelist()
              else:
                  with tarfile.open(archive) as package:
                      names = package.getnames()
              for required in ("LICENSE", "THIRD_PARTY_NOTICES.md"):
                  assert any(name.endswith("/" + required) for name in names), (archive, required)
          PY
      - run: uv run agent-storage-guard --help
